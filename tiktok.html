<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Conectar TikTok</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050816;color:#F1F5F9;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
main{width:min(520px,92vw);padding:28px;border:1px solid rgba(22,119,255,.5);border-radius:18px;background:#0E1526;box-shadow:0 0 30px rgba(22,119,255,.3)}
h1{margin:0 0 8px;font-size:22px}p{color:#CBD5E1;line-height:1.5}
textarea{width:100%;height:96px;box-sizing:border-box;border-radius:10px;border:1px solid #1677FF;background:#050816;color:#fff;padding:10px;font:13px ui-monospace,Menlo,Consolas,monospace;resize:none}
button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:12px;background:#1677FF;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.err{color:#FF6B81}
</style>
</head>
<body>
<main>
  <h1>Conectar TikTok</h1>
  <p id="msg">Cargando…</p>
  <textarea id="cod" readonly hidden></textarea>
  <button id="cp" hidden>Copiar código</button>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search),code=q.get("code"),err=q.get("error_description")||q.get("error");
  var msg=document.getElementById("msg"),cod=document.getElementById("cod"),cp=document.getElementById("cp");
  if(code){
    msg.textContent="Copia este código y pégalo en la app Jefren97 Admin (Conexiones > TikTok > paso 2).";
    cod.value=code;cod.hidden=false;cp.hidden=false;
    cp.onclick=function(){cod.select();try{navigator.clipboard.writeText(code)}catch(e){document.execCommand("copy")}cp.textContent="¡Copiado!"};
  }else{
    msg.className="err";msg.textContent=err?("TikTok respondió: "+err):"No llegó ningún código. Vuelve a la app y pulsa «1. Autorizar en TikTok».";
  }
  history.replaceState(null,"",location.pathname);
})();
</script>
</body>
</html>
